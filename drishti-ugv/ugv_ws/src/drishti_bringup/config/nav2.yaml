# Nav2 configuration for DRISHTI-UGV.
#
# ===========================================================================
# THE ONE THING THAT MUST NOT BE CHANGED CASUALLY
#
# The controller publishes to /cmd_vel_nav, NOT /cmd_vel. The safety
# supervisor is the only publisher on /cmd_vel (SPEC.md 4.3 and 9.4.1). If
# Nav2 can reach the base directly, the safety design is void and every claim
# made about deterministic stopping becomes false.
#
# After the first real bringup, confirm with:
#     ros2 topic info /cmd_vel --verbose
# It must list exactly one publisher, and that publisher must be
# safety_supervisor.
# ===========================================================================
#
# Values here are Phase 1 starting points sized for the platform in
# drishti_description (0.6 x 0.4 m footprint, 0.44 m wheel separation,
# v_max 1.2 m/s). They are not tuned. Phase 7 tunes them; EVALUATION.md
# records what changed and what it did to the mission numbers.
#
# !! UNVERIFIED !! Never loaded by Nav2. Parameter NAMES drift between Nav2
# releases -- check this file against the installed version before believing
# it, especially the MPPI critic list.

amcl:
  ros__parameters:
    use_sim_time: true
    # AMCL is present only so nav2_bringup does not complain if it is started.
    # It is NOT part of the design: localisation is RTAB-Map from Phase 2, and
    # there is no map-server-provided static map to localise against.
    # Prefer launching without AMCL entirely.
    set_initial_pose: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0        # SPEC.md 8: >= 20 Hz prototype
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    # ------------------------------------------------------------------
    # The safety seam. Do not point this at /cmd_vel.
    # ------------------------------------------------------------------
    cmd_vel_topic: /cmd_vel_nav

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # MPPI: evaluates candidate futures against the local costmap rather than
    # following a geometric line, which is what an outdoor UGV needs (SPEC.md 7.1).
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 1.2                     # matches v_max in drishti.yaml
      vx_min: -0.35                   # reverse is for recovery, not travel
      vy_max: 0.0                     # differential drive: no lateral motion
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Footprint from drishti_description: 0.6 x 0.4 m hull, with margin.
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      # Order matters only for readability: the traversability layer takes the
      # maximum against what is already there and never lowers a cost, so it
      # cannot erase an obstacle the depth cloud saw. Inflation stays last.
      plugins: ["obstacle_layer", "traversability_layer", "inflation_layer"]
      traversability_layer:
        plugin: "drishti_traversability::TraversabilityLayer"
        enabled: true
        topic: /traversability
        cost_layer: traversability
        lethal_layer: lethal
        # Older than this and the layer reports itself stale rather than
        # authorising motion on terrain it can no longer vouch for.
        max_age: 2.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_cloud
        depth_cloud:
          topic: /camera/points
          data_type: "PointCloud2"
          max_obstacle_height: 1.5
          min_obstacle_height: 0.08
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.2
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.10
      track_unknown_space: true
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      plugins: ["obstacle_layer", "traversability_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_cloud
        depth_cloud:
          topic: /camera/points
          data_type: "PointCloud2"
          max_obstacle_height: 1.5
          min_obstacle_height: 0.08
          obstacle_max_range: 8.0
          obstacle_min_range: 0.2
          raytrace_max_range: 10.0
          raytrace_min_range: 0.2
          clearing: true
          marking: true
      traversability_layer:
        plugin: "drishti_traversability::TraversabilityLayer"
        enabled: true
        topic: /traversability
        cost_layer: traversability
        lethal_layer: lethal
        max_age: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0   # SPEC.md 8: >= 5 Hz prototype
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false            # SPEC.md 6.2: unknown is not free

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # Recovery behaviours must also respect the seam.
    cmd_vel_topic: /cmd_vel_nav
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    # Both sides stay on the Nav2 side of the seam. The supervisor sits
    # downstream of everything here.
    feedback: "OPEN_LOOP"
    max_velocity: [1.2, 0.0, 1.9]
    min_velocity: [-0.35, 0.0, -1.9]
    max_accel: [1.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odom"
    odom_duration: 0.1

# ===========================================================================
# collision_monitor -- placeholder config, added 27 Sep 2026.
#
# nav2_bringup's navigation_launch.py includes this node unconditionally
# (Nav2 Jazzy source, ros-navigation/navigation2). Left unconfigured it fails
# `on_configure()` with "parameter 'observation_sources' is not initialized"
# and the lifecycle manager aborts the ENTIRE Nav2 bring-up -- this is what
# broke the first real headless run of Phase 1.
#
# DO NOT copy Nav2's own example params verbatim to fix this: its shipped
# nav2_params.yaml sets `cmd_vel_out_topic: "cmd_vel"`, which would make this
# node a SECOND publisher on /cmd_vel -- exactly the invariant this file's own
# header above exists to protect. `ros2 topic info /cmd_vel --verbose` must
# keep showing exactly one publisher: safety_supervisor.
#
# This config is deliberately inert: cmd_vel_in_topic/cmd_vel_out_topic point
# at placeholder topic names nothing else in this system publishes or
# subscribes to, and polygons/observation_sources are empty, so the node
# configures and activates cleanly without monitoring anything or touching
# any real command topic. Deciding where collision_monitor should actually
# sit in the pipeline -- if at all, given the safety supervisor already owns
# every stop decision (SPEC.md 9) -- is a real design choice for the team,
# not something to leave as a guessed default.
# ===========================================================================
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "collision_monitor/unused_in"
    cmd_vel_out_topic: "collision_monitor/unused_out"
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    base_shift_correction: true
    polygons: []
    # An empty list here was tried first and made things worse: it crashed
    # the node outright (rclcpp::exceptions::InvalidParameterValueException,
    # "No parameter value set") instead of cleanly failing to configure, and
    # left the lifecycle manager hung waiting forever for a service call that
    # would never come back. observation_sources apparently must be a real,
    # non-empty, correctly-typed list -- so this points at a placeholder
    # PointCloud2 topic nothing publishes to. It will simply always read as
    # timed-out (no data), contributing no obstacle information -- still
    # inert, but validly typed instead of relying on empty-list parsing that
    # already proved unreliable.
    observation_sources: ["placeholder_source"]
    placeholder_source:
      type: "pointcloud"
      topic: "collision_monitor/unused_points"
      min_height: 0.0
      max_height: 3.0
      enabled: true
